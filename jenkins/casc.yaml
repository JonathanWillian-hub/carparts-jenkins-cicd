jenkins:
  systemMessage: "Carparts · CI/CD on-premises · builds somente em agents"
  numExecutors: 0
  mode: EXCLUSIVE
  slaveAgentPort: -1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${ADMIN_PASSWORD}"
        - id: "release-manager"
          password: "${APPROVER_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        - user:
            name: "release-manager"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
  nodes:
    - permanent:
        name: "ubuntu-ci"
        remoteFS: "/home/jenkins/agent-ci"
        numExecutors: 2
        mode: EXCLUSIVE
        labelString: "linux ci"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              internalDir: "remoting"
              failIfWorkDirIsMissing: false
    - permanent:
        name: "ubuntu-release"
        remoteFS: "/home/jenkins/agent-release"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "linux docker azure release"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              internalDir: "remoting"
              failIfWorkDirIsMissing: false
unclassified:
  location:
    url: "http://localhost:8080/"
